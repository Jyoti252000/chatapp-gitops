apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: chat-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secretsmanager-credentials
            key: access-key
          secretAccessKeySecretRef:
            name: aws-secretsmanager-credentials
            key: secret-access-key