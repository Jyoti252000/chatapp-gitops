apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
        - resources:
            kinds:
              - Pod
      validate:
        message: "Using a mutable image tag like 'latest' (or no tag at all) is not allowed — pin a specific version."
        pattern:
          spec:
            containers:
              - image: "!*:latest"