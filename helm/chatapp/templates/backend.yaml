apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    namespace: {{ .Values.namespace }}
    labels:
        app: backend
spec:
    replicas: {{ .Values.backend.replicaCount }}
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
                - name: chatapp-backend
                  image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
                  imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
                  ports:
                    - containerPort: {{ .Values.backend.port }}
                  env:
                    - name: NODE_ENV
                      value: "production"
                    - name: PORT
                      value:  {{ .Values.backend.port | quote }}
                    - name: MONGO_USER
                      valueFrom:
                        secretKeyRef:
                            name: mongodb-secrets
                            key: username
                    - name: MONGO_PASS
                      valueFrom:
                        secretKeyRef:
                            name: mongodb-secrets
                            key: password
                    - name: MONGODB_URI
                      value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@mongodb:{{ .Values.mongodb.port }}/dbname?authSource=admin"
                    - name: JWT_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: chatapp-secrets
                            key: jwt
                  resources:
                    {{- toYaml .Values.backend.resources | nindent 20 }}
                  readinessProbe:
                    httpGet:
                        path: /health
                        port: {{ .Values.backend.port }}
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  livenessProbe:
                    httpGet: 
                        path: /health
                        port: {{ .Values.backend.port }}
                    initialDelaySeconds: 15
                    periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
    name: backend
    namespace: {{ .Values.namespace }}
spec:
    selector:
        app: backend
    ports:
        - port: {{ .Values.backend.port }}
          targetPort: {{ .Values.backend.port }}

                