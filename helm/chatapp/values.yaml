    tag: 626178da51ea76fb6a5fbef5e7f564e831d86c7e
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 5001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi


frontend:
  image:
    repository: 693517970741.dkr.ecr.eu-west-1.amazonaws.com/chatapp-frontend
