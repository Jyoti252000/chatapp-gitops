    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
  auth:
    username: mongoadmin
    password: CHANGE_ME_placeholder

secrets:
  jwtSecret: CHANGE_ME_placeholder
